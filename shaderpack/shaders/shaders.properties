# Realistic PBR Shaders - made for the "Mellow Realistic PBR" resource pack (labPBR 1.3)

clouds=off
oldLighting=false
separateAo=true
underwaterOverlay=false
vignette=false
sun=false
moon=true
dynamicHandLight=true
particles.ordering=after

blend.gbuffers_water.colortex6=off
blend.gbuffers_hand_water.colortex6=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_entities.colortex3=off

program.world-1/shadow.enabled=false
program.world1/shadow.enabled=false

# --------------------------------------------------------------------- menu
screen=<profile> <empty> [LIGHTING] [SHADOWS] [MATERIALS] [REFLECTIONS] [WATER] [ATMOSPHERE] [TERRAIN] [POST]
screen.LIGHTING=SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY MIN_LIGHT HANDHELD_LIGHT sunPathRotation
screen.SHADOWS=SHADOWS shadowMapResolution shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES COLORED_SHADOWS
screen.MATERIALS=NORMAL_MAPPING SPECULAR_MAPPING POM POM_SHADOWS POM_STEPS POM_DEPTH POM_DISTANCE <empty> EMISSION_STRENGTH SSS_STRENGTH WET_SURFACES
screen.REFLECTIONS=SSR SSR_STEPS SSR_THRESHOLD
screen.WATER=WATER_WAVES WATER_WAVE_HEIGHT WATER_REFRACTION WATER_DENSITY
screen.ATMOSPHERE=CLOUDS CLOUD_COVERAGE CLOUD_HEIGHT STARS FOG_DENSITY GODRAYS GODRAYS_STRENGTH
screen.TERRAIN=WAVING_PLANTS WAVING_SPEED
screen.POST=BLOOM BLOOM_STRENGTH EXPOSURE AUTO_EXPOSURE SATURATION CONTRAST VIGNETTE

sliders=SUN_INTENSITY AMBIENT_INTENSITY BLOCKLIGHT_INTENSITY MIN_LIGHT sunPathRotation shadowMapResolution \
 shadowDistance SHADOW_SOFTNESS SHADOW_SAMPLES POM_STEPS POM_DEPTH POM_DISTANCE EMISSION_STRENGTH SSS_STRENGTH \
 SSR_STEPS SSR_THRESHOLD WATER_WAVE_HEIGHT WATER_DENSITY CLOUD_COVERAGE CLOUD_HEIGHT FOG_DENSITY GODRAYS_STRENGTH \
 WAVING_SPEED BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST VIGNETTE

# ----------------------------------------------------------------- profiles
profile.LOW=shadowMapResolution=1024 shadowDistance=64.0 SHADOW_SAMPLES=4 !COLORED_SHADOWS POM_STEPS=16 \
 POM_DISTANCE=8.0 !POM_SHADOWS !SSR !GODRAYS !CLOUDS
profile.MEDIUM=shadowMapResolution=2048 shadowDistance=96.0 SHADOW_SAMPLES=8 COLORED_SHADOWS POM_STEPS=32 \
 POM_DISTANCE=16.0 POM_SHADOWS SSR SSR_STEPS=16 GODRAYS CLOUDS
profile.HIGH=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_SAMPLES=12 COLORED_SHADOWS POM_STEPS=48 \
 POM_DISTANCE=24.0 POM_SHADOWS SSR SSR_STEPS=24 GODRAYS CLOUDS
profile.ULTRA=shadowMapResolution=4096 shadowDistance=192.0 SHADOW_SAMPLES=24 COLORED_SHADOWS POM_STEPS=96 \
 POM_DISTANCE=48.0 POM_SHADOWS SSR SSR_STEPS=48 GODRAYS CLOUDS
